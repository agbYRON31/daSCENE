<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoRo Composite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee3;--card:#fbf8f1;--ink:#17140f;--ink2:#3a352d;--mute:#7a7266;--rule:#1b1813;--hair:#d9d1c1;
  --green:#2e6a3e;--green2:#5f9a5a;--greenbg:#dfe9d6;--red:#a1302a;--red2:#cf6a52;--redbg:#f2dbd3;
  --amber:#b47a1d;--amberbg:#f3e6c8;--dark:#16140f;--darkink:#efe9dc;
  --serif:"Source Serif 4",Georgia,serif;--disp:"Playfair Display",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:18px 28px 60px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--amber)}
b,strong{font-weight:600}
/* masthead */
.strip{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px}
h1{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1.05;margin:14px 0 4px;letter-spacing:-.01em}
h1 em{color:var(--red);font-style:italic}
.dek{font-style:italic;color:var(--ink2);max-width:860px;margin:0 0 14px}
.banner{border:1.5px solid var(--red);background:var(--redbg);padding:10px 14px;margin:10px 0;font-size:14px}
.banner.amber{border-color:var(--amber);background:var(--amberbg)}
/* section heads */
.sec{margin-top:34px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:3px double var(--rule);padding-top:8px;margin-bottom:12px}
.sechead h2{font-family:var(--disp);font-size:22px;margin:0;font-weight:800}
.sechead h2 span{font-family:var(--mono);font-size:12px;color:var(--red);margin-right:10px;font-weight:600}
.howto{border-left:3px solid var(--rule);background:var(--card);padding:8px 12px;margin:0 0 14px;font-size:13.5px;color:var(--ink2)}
.howto .mono{display:block;margin-bottom:3px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--hair);padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-flags{grid-template-columns:1.1fr 1fr .8fr}
.tabs{flex-wrap:wrap}
@media(max-width:900px){.g2,.g3,.g4,.g-flags{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}.wrap{padding:14px 16px}}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 6px;border:1px solid currentColor;font-weight:600}
.tag.on,.tag.OPP,.tag.OFFENSE{color:var(--green);background:var(--greenbg)}
.tag.off,.tag.RISK,.tag.DEFENSE{color:var(--red);background:var(--redbg)}
.tag.neu,.tag.WARN,.tag.NEUTRAL{color:var(--amber);background:var(--amberbg)}
/* posture navigator */
.nav{border:2px solid var(--rule);background:var(--card)}
.navhead{background:var(--dark);color:var(--darkink);padding:7px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.navbody{display:grid;grid-template-columns:1.1fr 1fr 1.2fr}
.navbody>div{padding:14px 16px;border-right:1px solid var(--hair)}
.navbody>div:last-child{border-right:0}
@media(max-width:900px){.navbody{grid-template-columns:1fr}.navbody>div{border-right:0;border-bottom:1px solid var(--hair)}}
.big{font-family:var(--disp);font-weight:800;font-size:54px;line-height:1;margin:6px 0 2px}
.scale{padding:14px 16px 10px;border-top:1px solid var(--hair)}
.scalebar{position:relative;height:22px;display:flex;border:1px solid var(--rule)}
.scalebar>div{height:100%}
.marker{position:absolute;top:-6px;width:0;height:34px;border-left:3px solid var(--ink)}
.marker.prev{border-left:2px dashed var(--mute)}
.marker.prev span{top:auto;bottom:-16px;color:var(--mute)}
.marker span{position:absolute;top:-16px;left:-14px;font-family:var(--mono);font-size:10px;white-space:nowrap}
/* master */
.master{background:var(--dark);color:var(--darkink);padding:18px;display:grid;grid-template-columns:260px 1fr 1fr;gap:20px;border:2px solid var(--rule)}
.master .mute{color:#a59c8c}
.master h3{font-family:var(--disp);font-size:24px;margin:4px 0}
@media(max-width:900px){.master{grid-template-columns:1fr}}
.tilt{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #3a352c;font-size:13.5px}
.tilt b{font-family:var(--mono);font-size:11px;min-width:110px;letter-spacing:.05em}
/* gauges */
.gauge text{font-family:var(--mono)}
.hcard .val{font-family:var(--disp);font-size:40px;font-weight:800}
/* tabs */
.tabs{display:flex;gap:0;border:1px solid var(--rule)}
.tabs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:5px 10px;border-right:1px solid var(--rule)}
.tabs button:last-child{border-right:0}
.tabs button.act{background:var(--ink);color:var(--paper)}
.tabs button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* bucket */
.bk .num{font-family:var(--disp);font-size:32px;font-weight:800}
/* history */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.legend label{cursor:pointer;display:flex;gap:6px;align-items:center}
/* flags */
.flag{border-left:4px solid var(--amber);padding:8px 10px;background:var(--card);margin-bottom:8px;font-size:13.5px}
.flag.RISK{border-color:var(--red)}.flag.OPP{border-color:var(--green)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--hair);font-size:13.5px;vertical-align:middle}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-bottom:1.5px solid var(--rule);cursor:default;white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--red)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ftable{overflow-x:auto}
.scorebar{position:relative;width:120px;height:10px;background:#ece5d6}
.scorebar i{position:absolute;top:0;height:100%}
.scorebar:after{content:"";position:absolute;left:50%;top:-2px;height:14px;border-left:1px solid var(--ink)}
/* leadership */
.lead{display:grid;grid-template-columns:48px 1.4fr 1fr 1fr 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}
.lead .rk{font-family:var(--disp);font-size:26px;font-weight:800}
.lead.eq{background:var(--amberbg)}
@media(max-width:700px){.lead{grid-template-columns:40px 1fr 1fr}.lead .hide-sm{display:none}}
.hbar{position:relative;height:12px;background:#ece5d6}
.hbar i{position:absolute;top:0;height:100%}
.hbar:after{content:"";position:absolute;left:50%;top:-2px;height:16px;border-left:1px solid var(--ink)}
/* scenarios */
.scen table td,.scen table th{padding:4px 6px;font-size:12.5px}
.scen tr.int td{background:var(--amberbg);font-weight:600}
/* analogs */
.analog{border:1.5px solid var(--rule);background:var(--card);margin-bottom:16px}
.analog .top{display:grid;grid-template-columns:150px 1.2fr 1fr;gap:16px;padding:14px 16px;border-bottom:1px solid var(--hair)}
@media(max-width:900px){.analog .top{grid-template-columns:1fr}}
.analog .when{font-family:var(--disp);font-size:28px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{border:1px solid var(--hair);padding:6px}
.stats b{display:block;font-family:var(--disp);font-size:20px}
.bt{padding:12px 16px;background:#f6f1e6}
.bt .row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:5px 0;border-bottom:1px dotted var(--hair);font-size:13.5px}
.fp{display:flex;gap:4px;align-items:flex-end;height:104px}
.fp .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.fp .bars{position:relative;width:100%;height:88px;display:flex;gap:2px;justify-content:center}
.fp .bars i{display:block;width:40%;position:absolute;bottom:50%}
details summary{cursor:pointer}
footer{margin-top:40px;border-top:3px double var(--rule);padding-top:12px;font-size:12.5px;color:var(--ink2)}
.foot3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}
@media(max-width:900px){.foot3{grid-template-columns:1fr}}
.spark{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA=/*__DATA__*/null;
(function(){
const D=DATA, $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sgn=v=>v==null?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(Math.abs(v)<10&&v%1?1:0).replace(/\.0$/,"");
const pct=v=>v==null?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(1)+"%";
const cls=v=>v==null?"":(v>=20?"pos":v<=-20?"neg":"neu");
const clsS=v=>v==null?"":(v>0?"pos":v<0?"neg":"");
const col=v=>v>=20?"var(--green)":v<=-20?"var(--red)":"var(--amber)";
const BN=D.bucket_names, BK=Object.keys(BN), SHORT={MACRO:"MAC",MONETARY:"MON",TECHNICALS:"TEC",CREDIT:"CRE",VOL:"SEN",CROSS:"X-A"};
const HZ=D.horizons;

/* semicircle gauge, −100..+100 */
function gauge(v,{w=200,dark=false,label=true}={}){
  const r=w*0.42,cx=w/2,cy=w*0.54,sw=w*0.075;
  const pt=(x,rr)=>{const a=Math.PI*(1-(x+100)/200);return[cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
  const arc=(a,b,c)=>{const[p,q]=pt(a,r),[s,t]=pt(b,r);return `<path d="M${p} ${q} A${r} ${r} 0 0 1 ${s} ${t}" stroke="${c}" stroke-width="${sw}" fill="none"/>`};
  const segs=[[-100,-60,"#7d1f1a"],[-60,-20,"var(--red2)"],[-20,20,"#d9b46a"],[20,60,"var(--green2)"],[60,100,"var(--green)"]];
  const vv=Math.max(-100,Math.min(100,v??0)),[nx,ny]=pt(vv,r*0.92);
  const ink=dark?"#efe9dc":"#17140f";
  return `<svg class="gauge" viewBox="0 0 ${w} ${w*0.66}" width="100%" style="max-width:${w}px;display:block;margin:0 auto" role="img" aria-label="Score ${v}">
  ${segs.map(s=>arc(s[0]+0.6,s[1]-0.6,s[2])).join("")}
  <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${ink}" stroke-width="${w*0.018}" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="${w*0.03}" fill="${ink}"/>
  ${label?`<text x="${cx-r}" y="${cy+w*0.09}" font-size="${w*0.05}" text-anchor="middle" fill="${ink}" opacity=".6">−100</text>
  <text x="${cx}" y="${cy-r-w*0.06}" font-size="${w*0.05}" text-anchor="middle" fill="${ink}" opacity=".6">0</text>
  <text x="${cx+r}" y="${cy+w*0.09}" font-size="${w*0.05}" text-anchor="middle" fill="${ink}" opacity=".6">+100</text>`:""}
  </svg>`;
}
function spark(arr,{w=90,h=22,stroke="var(--ink)",zero=false}={}){
  const a=(arr||[]).filter(x=>x!=null);if(a.length<2)return"";
  const mn=Math.min(...a,zero?0:Infinity),mx=Math.max(...a,zero?0:-Infinity),rg=mx-mn||1;
  const P=a.map((y,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(y-mn)/rg*(h-4)).toFixed(1)}`).join(" ");
  const z=zero?`<line x1="0" x2="${w}" y1="${h-2-(0-mn)/rg*(h-4)}" y2="${h-2-(0-mn)/rg*(h-4)}" stroke="var(--hair)"/>`:"";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${z}<polyline points="${P}" fill="none" stroke="${stroke}" stroke-width="1.3"/></svg>`;
}
const scoreBar=v=>{if(v==null)return'<div class="scorebar"></div>';const x=Math.max(-100,Math.min(100,v));
  return `<div class="scorebar"><i style="left:${x<0?50+x/2:50}%;width:${Math.abs(x)/2}%;background:${col(x)}"></i></div>`};

let H="";
/* ── masthead ── */
H+=`<div class="strip mono"><span>RoRo Composite · Live build</span><span>Coverage: US equities</span><span>Data as of ${esc(D.asof)} · generated ${esc(D.generated)}</span></div>
<h1>The Risk-On / Risk-Off <em>Composite</em></h1>
<p class="dek">A multi-horizon, six-bucket dashboard tracking ${D.n_factors} cross-asset, macro, credit, technical, volatility and policy signals — ${D.n_live} live today — pulled from FRED and Yahoo Finance and scored on every run.</p>`;
if(D.demo)H+=`<div class="banner"><b>DEMO MODE — SYNTHETIC DATA.</b> Every number on this page comes from randomly generated series used to test the pipeline. Run <code>python roro.py</code> without <code>--demo</code> for real readings.</div>`;
if(D.stale&&D.stale.length)H+=`<div class="banner amber"><b>${D.stale.length} data series missing or served from cache</b> — scores re-weight around them. See Data Health at the bottom.</div>`;

/* ── posture navigator ── */
const P=D.posture,L=D.lines;
const pc=P.band==="OFFENSE"?"pos":P.band==="DEFENSE"?"neg":"neu";
const stat={"NO CHANGE":["●","NO CHANGE",`Signal is holding ${P.band}. No flip underway.`],
  "WATCH":["◐","WATCH",`Within 5 pts of the ${P.nearest} line — a flip is close.`],
  "FLIPPED":["◆","FLIPPED",`Posture changed to ${P.band} since the last run.`]}[P.status];
const distTxt=P.band==="DEFENSE"?`${Math.abs(P.to_def)} pts below the Defense line (−20); ${P.to_off} pts from Offense (+20).`
  :P.band==="OFFENSE"?`${Math.abs(P.to_off)} pts above the Offense line (+20); ${P.to_def} pts from Defense (−20).`
  :`${P.to_off} pts from the Offense line (+20); ${P.to_def} pts from the Defense line (−20).`;
const xpos=v=>((Math.max(-100,Math.min(100,v))+100)/2);
H+=`<div class="nav" style="margin-top:14px">
<div class="navhead mono"><span><b>Posture Navigator</b> · Offense / Defense</span><span>Driven by the Intermediate dial (1–3 months)</span></div>
<div class="navbody">
 <div><div class="mono mute">Current posture · Intermediate</div>
  <div class="big ${pc}">${esc(P.band)}</div>
  <div class="mono">${P.lean?esc(P.lean):esc(D.master.regime)}</div>
  <p style="margin:8px 0 4px"><b>Direction:</b> ${esc(P.direction)}</p>
  <div>Intermediate dial <b class="${cls(P.value)}">${sgn(P.value)}</b> / 100</div>
  <div class="mute">Tactical ${sgn(P.tac)} · Strategic ${sgn(P.strat)}</div></div>
 <div><div class="mono mute">Signal status · changing or not?</div>
  <div class="mono" style="font-size:13px;margin:8px 0"><b>${stat[0]} ${stat[1]}</b></div>
  <p style="margin:0 0 6px">${esc(stat[2])} In ${esc(P.band)} since ${esc(P.since)} (${P.days_in} sessions).</p>
  <p style="margin:0 0 6px">Trajectory: ${P.delta>0?"rising":P.delta<0?"falling":"flat"} <b>${sgn(P.delta)} pts</b> since last run (${esc(P.prev_date)}). ${distTxt}</p>
  <p style="margin:0">${P.tac_agree?`<b>Tactical confirms:</b> the fast dial (${sgn(P.tac)}) points the same way as Intermediate.`:`<b>Tactical disagrees:</b> the fast dial (${sgn(P.tac)}) is pointing a different way — an early tell worth watching.`}</p></div>
 <div><div class="mono mute">Offense / Defense playbook</div>
  <p style="margin:8px 0">${esc(P.play)}</p>
  <p class="mute" style="margin:0"><b>Next shift →</b> A close above +${L.off} flips to Offense; below −${Math.abs(L.de)} flips to Defense. Nearest line: ${esc(P.nearest)}.</p></div>
</div>
<div class="scale"><div class="mono" style="display:flex;justify-content:space-between;margin-bottom:18px"><span class="neg">← Defense · risk-off</span><span class="neu">Neutral</span><span class="pos">Offense · risk-on →</span></div>
 <div class="scalebar"><div style="width:40%;background:var(--redbg)"></div><div style="width:20%;background:var(--amberbg)"></div><div style="width:40%;background:var(--greenbg)"></div>
  <div class="marker prev" style="left:${xpos(P.prev)}%"><span>○ ${sgn(P.prev)}</span></div>
  <div class="marker" style="left:${xpos(P.value)}%"><span>● ${sgn(P.value)}</span></div></div>
 <div class="mono mute" style="position:relative;height:14px;margin-top:4px"><span style="position:absolute;left:0">−100</span><span style="position:absolute;left:40%;transform:translateX(-50%)">−20</span><span style="position:absolute;left:50%;transform:translateX(-50%)">0</span><span style="position:absolute;left:60%;transform:translateX(-50%)">+20</span><span style="position:absolute;right:0">+100</span></div>
 <div class="mono mute" style="margin-top:10px">● today · ○ last run (${esc(P.prev_date)})</div></div>
</div>`;

/* ── master signal ── */
const M=D.master;
H+=`<div class="sec"><div class="master">
 <div><div class="mono mute">Master signal · allocation call</div>${gauge(M.value,{w:240,dark:true})}
  <div style="text-align:center;margin-top:-6px"><span class="big" style="font-size:44px;color:${col(M.value)}">${sgn(M.value)}</span></div>
  <div class="mono" style="text-align:center">${esc(M.regime)}</div></div>
 <div><div class="mono mute">Recommended action · intermediate horizon</div><h3>${esc(M.head)}</h3>
  <div class="mono" style="margin-bottom:8px">Confidence: ${esc(M.confidence)}</div><p>${esc(M.action)}</p></div>
 <div><div class="mono mute">Suggested allocation tilts</div>
  ${M.tilts.map(t=>`<div class="tilt"><b>${esc(t.arrow)} ${esc(t.name)}</b><span>${esc(t.text)}</span></div>`).join("")}
  <div class="mono mute" style="margin-top:10px">Leading asset classes (§05)</div>
  ${M.favored.map(f=>`<div class="tilt"><b style="color:#9fcf8f">LEAD #${f.rank}</b><span>${esc(f.name)}</span></div>`).join("")}
  ${M.under.map(f=>`<div class="tilt"><b style="color:#e59a86">LAG #${f.rank}</b><span>${esc(f.name)}</span></div>`).join("")}</div>
</div></div>`;

/* ── §01 horizons ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 01</span>Composite Score · By Horizon</h2><span class="mono mute">Range −100 to +100 · week-over-week change shown</span></div><div class="grid g3">`;
for(const h of HZ){
  H+=`<div class="card hcard"><div class="mono"><b>${esc(h.label)}</b> <span class="mute">· ${esc(h.desc)}</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center">
   <div>${gauge(h.value,{w:180})}</div>
   <div><div class="val ${cls(h.value)}">${sgn(h.value)}</div><div class="mono">${esc(h.regime)}</div>
   <div class="mono mute" style="margin-top:4px">WoW ${sgn(h.wow)} · 4w avg ${sgn(h.avg4w)}</div></div></div>
  <div class="mono mute" style="margin-top:6px">What this means</div><p style="margin:2px 0 8px">${esc(h.plain)}</p>
  <div class="mono mute">Top driver</div><p style="margin:2px 0 6px">${h.top?`${esc(h.top.bucket)} (${sgn(h.top.score)}) carries the most weight-adjusted support.`:"—"}</p>
  <div class="mono mute">Weakest link</div><p style="margin:2px 0 0">${h.low?`Watch ${esc(h.low.bucket)} (${sgn(h.low.score)}) for cracks.`:"—"}</p></div>`;
}
H+=`</div></div>`;

/* ── §02 buckets ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 02</span>Bucket Decomposition</h2><div class="tabs" id="bktabs" role="tablist">${HZ.map((h,i)=>`<button role="tab" data-h="${h.key}" class="${h.key==="intermediate"?"act":""}">${esc(h.label)} ${esc(h.span)}</button>`).join("")}</div></div>
<div class="howto"><span class="mono">How to read this</span>Each bucket scores −100 (very bearish) to +100 (very bullish); bucket scores are the same at every horizon — what changes is how much each one counts. Look for alignment vs. divergence: when buckets agree the call is high-confidence; when they split, the disagreement is itself the signal.</div>
<div class="grid g3" id="bkgrid"></div></div>`;

/* ── §03 history ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 03</span>Composite History · 24 Months</h2><span class="mono mute">Recomputed from source data each run</span></div>
<div class="howto"><span class="mono">How to read this</span>Bold line is the Intermediate composite (the switch); thin and dashed lines are Tactical and Strategic. Green band is the risk-on zone (above +20), red is risk-off (below −20); the dashed line at −60 marks crisis territory, which historically has been a contrarian zone.</div>
<div class="card chart" id="hist"></div>
<div class="legend mono" id="histleg"></div></div>`;

/* ── §04 flags + VIX + breadth ── */
const V=D.vix;
H+=`<div class="sec"><div class="sechead"><h2><span>§ 04</span>Active Divergence Flags &amp; VIX Playbook</h2><span class="mono mute">Rule-based · evaluated each run</span></div>
<div class="grid g-flags">
<div><div class="mono" style="margin-bottom:8px"><b>Active flags · ${D.flags.length} triggered</b></div>
${D.flags.length?D.flags.map(f=>`<div class="flag ${f.kind}"><span class="tag ${f.kind}">${f.kind}</span> <b>${esc(f.title)}.</b> ${esc(f.text)}<div class="mono mute" style="margin-top:4px">Triggered · ${f.sessions} session${f.sessions>1?"s":""}</div></div>`).join(""):`<div class="card mute">No flags triggered. The rule set checks horizon divergence, bucket disagreement, credit-vs-macro, narrow leadership, vol complacency, rates shocks, liquidity, Sahm, curve un-inversion and momentum breaks.</div>`}</div>
<div class="card">${V?`<div class="mono"><b>VIX playbook</b> <span class="mute">· DataTrek/Colas add-levels</span></div>
 ${gauge(Math.max(-100,Math.min(100,(V.current-V.mean)/V.sd*33)),{w:200,label:false})}
 <div style="text-align:center"><span class="big" style="font-size:38px">${V.current}</span><div class="mono">${esc(V.zone)}</div></div>
 <p style="font-size:13px">VIX is contrarian: low readings mean calm, but the best forward returns have come from buying when it's high. Long-run mean ${V.mean}, σ ${V.sd} (since ${V.since}).</p>
 <table><thead><tr><th>Level</th><th>VIX range</th><th class="n">12m SPX</th><th class="n">Win</th></tr></thead><tbody>
 <tr><td class="mono">Base</td><td>&lt; ${(V.mean+V.sd).toFixed(1)}</td><td class="n">${pct(V.base.ret)}</td><td class="n">${V.base.win??"—"}%</td></tr>
 ${V.levels.map(l=>`<tr><td class="mono">${esc(l.name)}</td><td>${l.lo} – ${l.hi??"+"}</td><td class="n ${clsS(l.ret)}">${l.ret==null?"n<10":pct(l.ret)}</td><td class="n">${l.win==null?"—":l.win+"%"}</td></tr>`).join("")}
 </tbody></table><div class="mono mute" style="margin-top:4px">Forward 12m SPX price return, computed from data since ${V.since}</div>
 <div class="grid g3" style="margin-top:10px;gap:6px">
  <div><div class="mono mute">VIX/VIX3M</div><b>${V.term??"—"}</b> <span class="mono">${V.term==null?"":V.term<1?"contango":"backwardation"}</span></div>
  <div><div class="mono mute">MOVE</div><b>${V.move??"—"}</b></div><div><div class="mono mute">SKEW</div><b>${V.skew??"—"}</b></div></div>`:`<div class="mute">VIX data unavailable.</div>`}</div>
<div class="card"><div class="mono"><b>Breadth</b> <span class="mute">· % sector ETFs above 200-DMA</span></div>
 ${D.breadth!=null?`${gauge(D.breadth*2-100,{w:180,label:false})}<div style="text-align:center"><span class="big" style="font-size:38px">${D.breadth}%</span>
 <div class="mono">${D.breadth>=70?"Broad participation":D.breadth>=40?"Mixed participation":"Narrow / weak"}</div></div>
 <p style="font-size:13px">Share of the 11 SPDR sector ETFs trading above their 200-day average. Broad bull markets keep most sectors above trend; a high index with few sectors above trend means narrow leadership.</p>`:`<div class="mute">Sector data unavailable.</div>`}</div>
</div></div>`;

/* ── §05 leadership ── */
const LD=D.leadership;
H+=`<div class="sec"><div class="sechead"><h2><span>§ 05</span>Asset Class Leadership · Relative Strength</h2><span class="mono mute">${LD.total} asset classes · ranked by 60/40 blend of 13w / 4w momentum · equities below #2 = risk-off flag</span></div>
<div class="card"><div class="mono" style="margin-bottom:6px">Equities position <b class="${LD.riskoff?"neg":"pos"}">#${LD.eq_rank} of ${LD.total} — ${LD.riskoff?"Risk-Off Signal":"Risk-On"}</b> <span class="mute">· held #${LD.eq_rank} for ${LD.eq_tenure_weeks} week${LD.eq_tenure_weeks===1?"":"s"}</span></div>
<div class="lead mono mute" style="padding:4px 0"><span>Rank</span><span>Asset class</span><span>13w</span><span class="hide-sm">4w</span><span class="hide-sm">Trend</span></div>
${LD.rows.map(r=>{const bar=(v,s)=>`<div style="display:flex;gap:8px;align-items:center"><div class="hbar" style="flex:1"><i style="left:${v<0?50+Math.max(-50,v/s*50):50}%;width:${Math.min(50,Math.abs(v)/s*50)}%;background:${v>=0?"var(--green2)":"var(--red2)"}"></i></div><span class="mono" style="min-width:52px;text-align:right">${pct(v)}</span></div>`;
 return `<div class="lead ${r.name==="Domestic Equities"?"eq":""}"><span class="rk">${String(r.rank).padStart(2,"0")}</span><span><b>${esc(r.name)}</b><br><span class="mono mute">${esc(r.tickers)}</span></span>${bar(r.r13??0,20)}<span class="hide-sm">${bar(r.r4??0,10)}</span><span class="mono hide-sm ${r.trend==="Rising"?"pos":r.trend==="Falling"?"neg":""}">${r.trend==="Rising"?"▲":r.trend==="Falling"?"▼":"─"} ${r.trend}</span></div>`}).join("")}
</div></div>`;

/* ── §06 factor table ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 06</span>Factor Detail · ${D.n_factors} Inputs</h2><div class="tabs" id="ftabs"><button class="act" data-b="ALL">All</button>${BK.map(b=>`<button data-b="${b}">${esc(BN[b].split(" /")[0])}</button>`).join("")}</div></div>
<div class="card ftable"><table><thead><tr><th class="sort" data-k="name">Factor</th><th class="sort" data-k="bucket">Bucket</th><th class="n">Reading</th><th>1y trend</th><th class="sort n" data-k="score">Score</th><th>−100 / +100</th><th class="sort n" data-k="weight">Weight</th><th class="sort n" data-k="contrib">Contrib.</th><th>Signal</th><th>Source</th></tr></thead><tbody id="fbody"></tbody></table>
<div class="mono mute" style="margin-top:6px">Weight is within-bucket (re-normalised over live factors). Click a column to sort.</div></div></div>`;

/* ── §07 scenarios ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 07</span>Scenario Stress Tests</h2><span class="mono mute">Forward what-ifs · today's dials re-scored under each shock</span></div>
<div class="howto"><span class="mono">How to read this</span>Each card overrides a handful of raw factor readings with shock values (see <code>config.py → SCENARIOS</code>), re-scores the model and shows where each dial would land. The Intermediate row is highlighted — a scenario that pushes it below −20 is one that would flip you to Defense.</div>
<div class="grid g2 scen">${D.scenarios.map(s=>`<div class="card"><div><span class="tag ${s.dir==="RISK-ON"?"on":"off"}">${s.dir}</span></div>
<h3 style="font-family:var(--disp);margin:6px 0 2px;font-size:20px">${esc(s.name)}</h3><p style="margin:0 0 8px;font-size:13.5px" class="mute">${esc(s.desc)}</p>
<table><thead><tr><th>Horizon</th><th class="n">Today</th><th class="n">If it hits</th><th>Posture</th></tr></thead><tbody>
${s.horizons.map(h=>`<tr class="${h.key==="intermediate"?"int":""}"><td>${esc(h.label)} · ${esc(h.span)}</td><td class="n">${sgn(h.today)}</td><td class="n ${cls(h.after)}">${sgn(h.after)} <span class="mute">(${sgn(h.delta)})</span></td><td><span class="tag ${h.posture}">${h.posture}</span></td></tr>`).join("")}
</tbody></table><div class="mono mute" style="margin-top:6px">Top factor moves (Δ score)</div><div style="font-size:13px">${s.moves.map(m=>`${esc(m.name)} <b class="${clsS(m.delta)}">${sgn(m.delta)}</b>`).join(" · ")}</div>
<div class="mono mute" style="margin-top:6px">Historical reference: ${esc(s.analog)}</div></div>`).join("")}</div></div>`;

/* ── §08 analogs ── */
H+=`<div class="sec"><div class="sechead"><h2><span>§ 08</span>Historical Analogs · Configuration Match</h2><span class="mono mute">Top ${D.analogs.length} prior month-ends · signal vs. buy &amp; hold, computed</span></div>
<div class="howto"><span class="mono">How to read this</span>These are past month-ends whose six-bucket fingerprint most resembles today's (match = 1 − distance ÷ combined magnitude, so both direction and size count). Forward returns and drawdowns are actual S&amp;P 500 price moves. The backtest replays the rule over the next 12 months: <b>out of equities (0% cash) whenever the model's Intermediate posture was Defense</b>, acting the next day, no costs. Because the model is scored with today's factor maps on revised data, treat these as in-sample.</div>
${D.analogs.map(a=>{const verdictCls=a.verdict.includes("HELPED")?"on":a.verdict.includes("HURT")?"off":"neu";
 const fp=BK.map(b=>{const t=a.then[b]??0,n=a.now[b]??0;const hh=v=>Math.min(50,Math.abs(v)/2);
   return `<div class="col"><div class="bars"><i style="left:8%;height:${hh(t)}%;${t<0?"bottom:auto;top:50%":""};background:var(--mute)"></i><i style="left:52%;height:${hh(n)}%;${n<0?"bottom:auto;top:50%":""};background:var(--ink)"></i><span style="position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--hair)"></span></div><span class="mono" style="font-size:9px">${SHORT[b]}</span></div>`}).join("");
 return `<div class="analog"><div class="top">
  <div><div class="when">${esc(a.date)}</div><div class="mono mute">Configuration match</div><div class="big" style="font-size:34px">${a.sim}%</div><div class="mono mute">cosine ${a.cos}% · composite then ${sgn(a.comp_then)}</div></div>
  <div><div class="mono mute" style="margin-bottom:4px"><span style="color:var(--mute)">■</span> then · <span>■</span> now</div><div class="fp">${fp}</div>
   <div class="stats" style="margin-top:10px"><div><span class="mono mute">Fwd 3m</span><b class="${clsS(a.fwd3)}">${pct(a.fwd3)}</b></div><div><span class="mono mute">Fwd 6m</span><b class="${clsS(a.fwd6)}">${pct(a.fwd6)}</b></div><div><span class="mono mute">Fwd 12m</span><b class="${clsS(a.fwd12)}">${pct(a.fwd12)}</b></div><div><span class="mono mute">Max DD</span><b class="neg">${pct(a.maxdd)}</b></div></div></div>
  <div><div class="mono mute">If you'd followed the signal</div><div style="margin:6px 0"><span class="tag ${verdictCls}">${esc(a.verdict)}</span></div>
   <table><tr><td>Signal rule, 12m</td><td class="n ${clsS(a.strat)}"><b>${pct(a.strat)}</b></td></tr><tr><td>Buy &amp; hold, 12m</td><td class="n ${clsS(a.bh)}"><b>${pct(a.bh)}</b></td></tr>
   <tr><td>Net vs B&amp;H</td><td class="n ${clsS(a.net)}"><b>${pct(a.net)}</b></td></tr><tr><td>Rule max drawdown</td><td class="n">${pct(a.strat_dd)}</td></tr></table></div></div>
 <div class="bt"><div class="row"><span class="mono">① Risk-off</span><span>${a.start_def?`Posture was already <b>Defense</b> at the start of the window${a.off?"":""}.`:a.off?`Intermediate posture first hit Defense on <b>${esc(a.off)}</b>.`:"Posture never reached Defense in the 12-month window — the rule stayed invested throughout."}</span></div>
  <div class="row"><span class="mono">② Back to risk-on</span><span>${a.on?`Left Defense on <b>${esc(a.on)}</b>.`:a.off?"Still in Defense at the end of the window.":"—"} ${a.days_out?`Out of the market ${a.days_out} sessions across ${a.switches} switch${a.switches===1?"":"es"}.`:""}</span></div>
  <div class="row"><span class="mono">Market low</span><span>Lowest S&amp;P close in the window: <b>${esc(a.low)}</b>.</span></div></div></div>`}).join("")||`<div class="card mute">Not enough history to find analogs.</div>`}
</div>`;

/* ── data health + methodology ── */
const HL=D.health;
H+=`<div class="sec"><details class="card"><summary class="mono"><b>Data health</b> · ${HL.filter(h=>h.status==="ok"||h.status==="synthetic").length}/${HL.length} series fresh${D.stale.length?` · <span class="neg">${D.stale.length} issues</span>`:""}</summary>
<div class="ftable"><table style="margin-top:8px"><thead><tr><th>Source</th><th>Series</th><th>Last observation</th><th>Status</th></tr></thead><tbody>
${HL.map(h=>`<tr><td class="mono">${esc(h.source)}</td><td class="mono">${esc(h.id)}</td><td>${esc(h.last??"—")}</td><td class="${h.status==="ok"||h.status==="synthetic"?"":"neg"}">${esc(h.status)}</td></tr>`).join("")}
</tbody></table></div></details></div>`;
const W=D.weights;
H+=`<footer><div class="foot3"><div><div class="mono"><b>Methodology</b></div><p>Each factor's raw reading is mapped to −100…+100 with a piecewise-linear score map (editable in <code>config.py</code>), weighted within its bucket, then buckets are combined with horizon-specific weights. Tactical uses the raw daily composite; Intermediate and Strategic are smoothed with 5- and 20-day EMAs. Missing factors and buckets are re-weighted away rather than treated as zero. VIX is scored contrarian per the DataTrek/Colas framework. Posture: Offense above +${L.off}, Defense below ${L.de}, Neutral between. Factor maps are hand-set, not fitted — the analog backtests are therefore in-sample illustrations, not out-of-sample evidence.</p></div>
<div><div class="mono"><b>Horizon bucket weights</b></div><table>${["tactical","intermediate","strategic"].map(h=>`<tr><td class="mono">${h}</td><td style="font-size:12px">${BK.map(b=>SHORT[b]+" "+W[h][b]).join(" · ")}</td></tr>`).join("")}</table></div>
<div><div class="mono"><b>Regime bands</b></div><div class="pos">▲ Risk-On Aggressive · +60 to +100</div><div class="pos">▲ Risk-On Constructive · +20 to +60</div><div class="neu">● Neutral · −20 to +20</div><div class="neg">▼ Risk-Off Defensive · −60 to −20</div><div class="neg">▼ Crisis · −100 to −60</div></div></div>
<p class="mono mute" style="margin-top:14px">Sources: FRED (Federal Reserve Bank of St. Louis), Yahoo Finance via yfinance. Not investment advice.${D.demo?" Demo build — synthetic data.":""}</p></footer>`;
$("#app").innerHTML=H;

/* ── interactive pieces ── */
function renderBuckets(h){
  const w=D.weights[h],tot=Object.values(w).reduce((a,b)=>a+b,0);
  $("#bkgrid").innerHTML=D.buckets.map((b,i)=>{const wt=w[b.key]/tot*100,c=b.score==null?null:wt*b.score/100;
    return `<div class="card bk"><div class="mono mute">§ 02 / 0${i+1}</div><div style="font-family:var(--disp);font-size:19px;font-weight:600">${esc(b.name)}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><span class="num ${cls(b.score)}">${sgn(b.score)}</span> <span class="mono ${clsS(b.wow)}">${sgn(b.wow)} wk</span></div>${spark(b.spark,{w:110,h:34,stroke:col(b.score??0),zero:true})}</div>
    ${scoreBar(b.score)}<div class="mono mute" style="margin-top:6px">Wt ${wt.toFixed(0)}% · Contrib ${c==null?"—":sgn(Math.round(c*10)/10)} · ${b.factors_live}/${b.factors_total} factors live</div></div>`}).join("");
}
document.querySelectorAll("#bktabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#bktabs button").forEach(x=>x.classList.toggle("act",x===b));renderBuckets(b.dataset.h)});
renderBuckets("intermediate");

let fFilter="ALL",fSort={k:"contrib",dir:-1};
function renderFactors(){
  let rows=D.factors.filter(f=>fFilter==="ALL"||f.bucket===fFilter);
  rows.sort((a,b)=>{const x=a[fSort.k],y=b[fSort.k];if(x==null)return 1;if(y==null)return -1;return (typeof x==="string"?x.localeCompare(y):x-y)*fSort.dir});
  $("#fbody").innerHTML=rows.map(f=>`<tr><td><b>${esc(f.name)}</b></td><td class="mono">${esc(f.bucket)}</td><td class="n">${esc(f.reading)}</td><td>${spark(f.spark,{w:80,h:20})}</td><td class="n ${cls(f.score)}"><b>${sgn(f.score)}</b></td><td>${scoreBar(f.score)}</td><td class="n">${f.weight}%</td><td class="n ${clsS(f.contrib)}">${sgn(f.contrib)}</td><td><span class="tag ${f.signal==="ON"?"on":f.signal==="OFF"?"off":"neu"}">${f.signal==="ON"?"▲ ON":f.signal==="OFF"?"▼ OFF":f.signal==="N/A"?"N/A":"● NEU"}</span></td><td class="mono mute" style="font-size:9.5px">${esc(f.src)}</td></tr>`).join("");
}
document.querySelectorAll("#ftabs button").forEach(b=>b.onclick=()=>{fFilter=b.dataset.b;document.querySelectorAll("#ftabs button").forEach(x=>x.classList.toggle("act",x===b));renderFactors()});
document.querySelectorAll("th.sort").forEach(th=>th.onclick=()=>{const k=th.dataset.k;fSort={k,dir:fSort.k===k?-fSort.dir:(k==="name"||k==="bucket"?1:-1)};renderFactors()});
renderFactors();

/* history chart */
const show={intermediate:true,tactical:true,strategic:true};
function renderHist(){
  const h=D.history,n=h.dates.length,W=1100,Hh=320,pl=36,pr=40,pt=10,pb=26;
  const x=i=>pl+i/(n-1)*(W-pl-pr),y=v=>pt+(100-v)/200*(Hh-pt-pb);
  const line=(k,st)=>{let d="",pen=false;h[k].forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" ";pen=true});return `<path d="${d}" fill="none" ${st}/>`};
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="24-month composite history">`;
  s+=`<rect x="${pl}" y="${y(100)}" width="${W-pl-pr}" height="${y(L.off)-y(100)}" fill="var(--greenbg)"/>`;
  s+=`<rect x="${pl}" y="${y(L.de)}" width="${W-pl-pr}" height="${y(-100)-y(L.de)}" fill="var(--redbg)"/>`;
  for(const g of [80,60,40,20,0,-20,-40,-60,-80])s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="${g===0?"var(--ink)":"var(--hair)"}" stroke-width="${g===0?1:.6}" ${g===L.crisis?'stroke-dasharray="5 4" stroke="var(--red)"':""}/><text x="${pl-6}" y="${y(g)+3}" font-family="JetBrains Mono" font-size="10" text-anchor="end" fill="var(--mute)">${g>0?"+":""}${g}</text>`;
  let lastM="";h.dates.forEach((d,i)=>{const m=d.slice(0,7);if(m!==lastM&&(+d.slice(5,7))%3===1){s+=`<text x="${x(i)}" y="${Hh-8}" font-family="JetBrains Mono" font-size="10" fill="var(--mute)">${["Jan","Apr","Jul","Oct"][Math.floor((+d.slice(5,7)-1)/3)]}·${d.slice(2,4)}</text>`}lastM=m});
  if(show.strategic)s+=line("strategic",'stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="5 3"');
  if(show.tactical)s+=line("tactical",'stroke="var(--mute)" stroke-width="1"');
  if(show.intermediate)s+=line("intermediate",'stroke="var(--ink)" stroke-width="2.2"');
  const lv=h.intermediate[n-1];if(lv!=null)s+=`<circle cx="${x(n-1)}" cy="${y(lv)}" r="5" fill="var(--red)"/><text x="${x(n-1)+8}" y="${y(lv)+4}" font-family="JetBrains Mono" font-size="11" font-weight="600">${sgn(Math.round(lv))}</text>`;
  $("#hist").innerHTML=s+"</svg>";
}
$("#histleg").innerHTML=[["intermediate","Intermediate (switch)","━"],["tactical","Tactical","─"],["strategic","Strategic","╌"]].map(([k,t,g])=>`<label><input type="checkbox" checked data-k="${k}"> ${g} ${t}</label>`).join("")+`<span class="mute">Green: risk-on zone · Red: risk-off zone · Dashed red: crisis (−60)</span>`;
document.querySelectorAll("#histleg input").forEach(c=>c.onchange=()=>{show[c.dataset.k]=c.checked;renderHist()});
renderHist();
})();
</script>
</body>
</html>
