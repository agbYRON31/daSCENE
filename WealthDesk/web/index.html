<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wealth Desk</title>
  <meta name="description" content="Financial education and illustration: plain-language client tools and 109 audited calculators. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c7861'/%3E%3Cpath d='M14 44 L26 30 L35 37 L50 20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/client">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"/><path d="M14 44 L26 30 L35 37 L50 20"/></svg>
      </span>
      <span>Wealth Desk</span>
    </a>
    <nav class="modes" aria-label="Mode">
      <a href="#/client" data-mode="client">Client</a>
      <a href="#/advisor" data-mode="advisor">Advisor</a>
      <a href="#/calc" data-mode="calc">Calculator</a>
    </nav>
    <div class="topbar-actions">
      <label class="taxyear">Tax year <select id="taxYear" aria-label="Tax year"></select></label>
      <button class="ghost" id="printBtn" title="Print, or save as PDF from the print dialog">Print / PDF</button>
      <button class="ghost" id="clearBtn" title="Erase everything typed in this tab">Clear all</button>
    </div>
  </header>
  <main id="app"><p class="loading">Loading…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
